# PostgreSQL everywhere.
#
# Development / test: settings come from .env (see .env.example) and the local
# Postgres started with `docker compose up -d db`.
#
# Production (Railway): set DATABASE_URL on the web service, e.g.
#   DATABASE_URL=${{Postgres.DATABASE_URL}}
# Solid Cache / Queue / Cable get their own databases on the same server
# (<name>_cache, <name>_queue, <name>_cable); `db:prepare` creates them.
<%
  production_url = lambda do |suffix = ""|
    url = ENV["DATABASE_URL"]
    next url if url.nil? || url.empty? || suffix.empty?

    uri = URI.parse(url)
    uri.path = "#{uri.path}#{suffix}"
    uri.to_s
  end
%>
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

local: &local
  <<: *default
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5434) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *local
  database: <%= ENV.fetch("DB_NAME", "auction_roof_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *local
  database: auction_roof_test

production:
  primary:
    <<: *default
    url: <%= production_url.call %>
  cache:
    <<: *default
    url: <%= production_url.call("_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    url: <%= production_url.call("_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    url: <%= production_url.call("_cable") %>
    migrations_paths: db/cable_migrate
